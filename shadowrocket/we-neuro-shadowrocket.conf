Spotify = select,DIRECT,海外主力,DMIT-TYO-TLS,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,policy-select-name=海外主力
Telegram = select,海外主力,DMIT-TYO-TLS,DMIT-LAX-TLS,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,PROXY,policy-select-name=海外主力
Twitter = select,DMIT-LAX-TLS,policy-select-name=DMIT-LAX-TLS
Facebook = select,海外主力,DMIT-TYO-TLS,DMIT-LAX-TLS,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,PROXY,policy-select-name=海外主力
PayPal = select,DMIT-LAX-TLS,海外主力,DIRECT,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,policy-select-name=DMIT-LAX-TLS
Amazon = select,海外主力,DIRECT,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,policy-select-name=海外主力

苹果服务 = select,DIRECT,海外主力,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,policy-select-name=DIRECT
微软服务 = select,DIRECT,海外主力,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,policy-select-name=DIRECT
哔哩哔哩 = select,DIRECT,PROXY,香港节点,台湾节点,policy-select-name=DIRECT
游戏平台 = select,DIRECT,海外主力,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,policy-select-name=海外主力

香港节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港
台湾节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化
日本节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日|日
新加坡节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=🇸🇬|SG|Sing|sing|新加坡|狮城|沪新|京新|深新|杭新|广新
韩国节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=🇰🇷|KR|Korea|korea|KOR|韩国|首尔|韩|韓|春川
美国节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美

