# Regional IEPL policy: prefer verified Advanced nodes, retain Standard in selector as manual backup.
# Experimental/beta and retired CUPN nodes are excluded from regional selectors.
# Fixed-node defaults are only for regions verified in the user's screenshots; no latency auto-switch.
# Korea has no verified Advanced name yet and retains manual selection.
# A fixed node name does not guarantee that a provider retains a stable egress IP.
香港节点 = select,policy-regex-filter=(?i)^(?!.*(?:cupn|实验|實驗|试验|試驗|experimental|experiment|beta)).*(?:🇭🇰|香港|Hong[ -]?Kong|\bHK\b).*$,policy-select-name=香港高级 IEPL 专线 3
台湾节点 = select,policy-regex-filter=(?i)^(?!.*(?:cupn|实验|實驗|试验|試驗|experimental|experiment|beta)).*(?:🇹🇼|台湾|台灣|台北|台中|新北|彰化|\b(?:TW|TWN|Taiwan|Taipei)\b).*$,policy-select-name=台湾高级 IEPL 专线 1
日本节点 = select,policy-regex-filter=(?i)^(?!.*(?:cupn|实验|實驗|试验|試驗|experimental|experiment|beta)).*(?:🇯🇵|日本|东京|大阪|\b(?:JP|Japan|Tokyo|TYO)\b).*$,policy-select-name=日本高级 IEPL 专线 1
新加坡节点 = select,policy-regex-filter=(?i)^(?!.*(?:cupn|实验|實驗|试验|試驗|experimental|experiment|beta)).*(?:🇸🇬|新加坡|狮城|獅城|\b(?:SG|Singapore)\b).*$,policy-select-name=新加坡高级 IEPL 专线 2
韩国节点 = select,policy-regex-filter=(?i)^(?!.*(?:cupn|实验|實驗|试验|試驗|experimental|experiment|beta)).*(?:🇰🇷|韩国|韓國|首尔|春川|\b(?:KR|KOR|Korea|Seoul)\b).*$
美国节点 = select,policy-regex-filter=(?i)^(?!.*(?:cupn|实验|實驗|试验|試驗|experimental|experiment|beta)).*(?:🇺🇸|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|\b(?:US|USA|America|United States|LAX)\b).*$,policy-select-name=美国高级 IEPL 专线 3

[Rule]
# Self-managed VPS management endpoints: always DIRECT.
# This keeps SSH/SCP/rsync/maintenance traffic out of proxy chains.
# DMIT LAX SSH / node management
IP-CIDR,69.63.220.253/32,DIRECT,no-resolve
# DMIT TYO SSH / node management
IP-CIDR,191.223.220.97/32,DIRECT,no-resolve
# FRA SSH / node management
IP-CIDR,189.24.99.45/32,DIRECT,no-resolve

# Xiyou cloud/server management: domains are preferred because backend IPs can change.
DOMAIN-SUFFIX,xiyoucloud.pro,DIRECT
DOMAIN-SUFFIX,xiyoucloud.net,DIRECT


# WebRTC/STUN privacy: keep STUN/ICE discovery on the proxy path in rule mode.
# Covers the listed STUN endpoints and ports; not every possible ICE/STUN path.
# Browser/device testing is still required; no universal no-leak guarantee.
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/STUN/STUN.list,海外主力
AND,((PROTOCOL,UDP),(DEST-PORT,3478)),海外主力
AND,((PROTOCOL,UDP),(DEST-PORT,19302)),海外主力
AND,((PROTOCOL,UDP),(DEST-PORT,5349)),海外主力

# Poe website, apps, OAuth and API: fixed DMIT LAX.
# poe.com suffix covers www/api/creator and Poe-hosted subdomains.
# Shared third-party identity/CDN domains are intentionally not swept into this rule.
DOMAIN-SUFFIX,poe.com,DMIT-LAX-TLS

# Grok / Cursor WORKFLOW: before shared AI and broad provider rules.
# Source: https://cursor.com/help/troubleshooting/sign-in-domains
# Source: https://docs.x.ai/grok-bot/proxies
# DOMAIN-SUFFIX includes nested computer.cluster.cursorvm.com hostnames.
# These are shared domains: the setting also affects Grok web/API and Cursor IDE.
# External IdPs keep their existing policy; this does not route a cloud computer's egress.
# Existing generic STUN rules above are unchanged, not guaranteed to share the IEPL exit.
